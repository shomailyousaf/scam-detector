stages:
  validate_raw:
    cmd: python -m src.data.validate
    deps:
      - data/raw/scam_messages_v1.csv
      - data/raw/scam_messages_v2_additions.csv
      - src/data/validate.py
      - src/data/schema.py
    params:
      - validation
    metrics:
      - reports/validation_raw.json:
          cache: false
      - reports/validation_v2_additions.json:
          cache: false

  prepare:
    cmd: python -m src.data.prepare
    deps:
      - data/raw/scam_messages_v1.csv
      - data/raw/scam_messages_v2_additions.csv
      - reports/validation_v2_additions.json
      - reports/validation_raw.json
      - src/data/prepare.py
      - src/common/textnorm.py
    params:
      - prepare
    outs:
      - data/interim/clean.csv
    metrics:
      - reports/prepare_report.json:
          cache: false
  
  split:
    cmd: python -m src.data.split
    deps:
      - data/interim/clean.csv
      - src/data/split.py
    params:
      - split
      - data.version
    outs:
      - data/processed
  
  check_splits:
    cmd: python -m src.data.check_splits
    deps:
      - data/processed
      - src/data/check_splits.py
      - src/data/schema.py
    params:
      - validation
      - data.version
    metrics:
      - reports/split_report.json:
          cache: false

  train_baselines:
    cmd: python -m src.models.train_baselines
    deps:
      - data/processed
      - reports/split_report.json
      - src/models/train_baselines.py
      - src/models/mlflow_utils.py
    params:
      - data.version
    metrics:
      - reports/metrics_rules_only.json:
          cache: false
      - reports/metrics_tfidf_logreg.json:
          cache: false

  make_batches:
    cmd: python -m src.monitoring.make_batches
    deps:
      - data/interim/clean.csv
      - data/processed
      - src/monitoring/make_batches.py
    params:
      - monitoring
    outs:
      - data/batches
