
data:
  raw_path: data/raw/scam_messages_v1.csv
  clean_path: data/interim/clean.csv
  processed_dir: data/processed
  version: v1                   
  additions_path: data/raw/scam_messages_v2_additions.csv
  additions_source: synthetic_v2_generic

validation:
  min_rows: 1000
  min_rows_additions: 100    
  min_text_chars: 2
  allowed_labels: [NORMAL, SCAM]
  allowed_languages: [English, Roman-Urdu, Urdu, Code-Mixed]
  scam_ratio_min: 0.20          
  scam_ratio_max: 0.80
  max_split_ratio_drift: 0.05   

prepare:
  max_text_chars: 2000          

split:
  seed: 42
  test_ratio: 0.15             
  val_ratio: 0.15               

monitoring:
  reference_path: data/processed/train.csv   # training data is our normal
  reference_sample: 5000        # sample so the check stays quick
  seed: 42
  feature_threshold: 0.25       # how different one feature has to be to count as drifted
  drift_share: 0.4              # alert if 40 percent of the features drifted
  batches_dir: data/batches
  normal_size: 500              # normal batch from validation data

retraining:
  model_name: scam-detector-tfidf   # the production model in the mlflow registry
  ngram_min: 2
  ngram_max: 5
  min_df: 2
  max_features: 300000
  C: 4.0
  seed: 42
  
  max_test_f1_drop: 0.005
  min_challenge_f1_gain: 0.0
